services:
  api:
    build: .
    restart: always
    container_name: jug-api
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8081:8080"

  db:
    image: mysql:8.0               
    environment:
      MYSQL_ROOT_PASSWORD: root        
      MYSQL_DATABASE: jugetes
    restart: always             
    volumes :
      - ./sql/mysql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data:   
